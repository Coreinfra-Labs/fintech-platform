global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'services'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'api-gateway:3000'
          - 'user-service:3001'
          - 'wallet-service:3002'
          - 'transaction-service:3003'
          - 'payment-service:3004'
          - 'fraud-service:3005'
          - 'notification-service:3006'
          - 'ledger-service:3008'
          - 'dlq-processor:3009'
          - 'web:3000'
