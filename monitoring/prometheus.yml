global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'services'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'api-gateway:9464'
          - 'user-service:9464'
          - 'wallet-service:9464'
          - 'transaction-service:9464'
          - 'payment-service:9464'
          - 'fraud-service:9464'
          - 'notification-service:9464'
          - 'ledger-service:9464'
          - 'dlq-processor:9464'
          - 'nibss-mock:9464'
