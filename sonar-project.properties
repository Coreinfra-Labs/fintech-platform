# ============================================================
# SonarQube Project Configuration
# ============================================================

sonar.projectKey=fintech-platform
sonar.projectName=Fintech Platform
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8

# ============================================================
# Source Directories
# ============================================================

sonar.sources=libs,services

# ============================================================
# Exclusions
# ============================================================

sonar.exclusions=\
**/node_modules/**,\
**/dist/**,\
**/.nx/**,\
**/coverage/**,\
**/tmp/**,\
**/generated/**,\
**/*.spec.ts,\
**/*.test.ts,\
**/*.spec.js,\
**/*.test.js,\
**/web-e2e/**

# ============================================================
# Test Directories
# ============================================================

sonar.tests=libs,services,tests

sonar.test.inclusions=\
**/*.spec.ts,\
**/*.test.ts,\
**/*.spec.js,\
**/*.test.js

# ============================================================
# Coverage
# ============================================================

sonar.coverage.exclusions=\
**/*.spec.ts,\
**/*.test.ts,\
**/*.spec.js,\
**/*.test.js,\
**/main.ts,\
**/index.ts,\
**/generated/**,\
**/web-e2e/**

# ============================================================
# JavaScript / TypeScript LCOV Coverage
# ============================================================

sonar.javascript.lcov.reportPaths=coverage/**/lcov.info