
# ============================================================
# SONARQUBE PROJECT CONFIGURATION
# ============================================================

sonar.projectKey=fintech-platform
sonar.projectName=Fintech Platform
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8

# ============================================================
# SOURCE DIRECTORIES
# ============================================================

sonar.sources=libs,services

# ============================================================
# SOURCE EXCLUSIONS
# ============================================================

sonar.exclusions=\
**/node_modules/**,\
**/dist/**,\
**/.nx/**,\
**/coverage/**,\
**/tmp/**,\
**/generated/**,\
**/*.spec.ts,\
**/*.test.ts,\
**/*.spec.js,\
**/*.test.js,\
**/web-e2e/**

# ============================================================
# TEST CONFIGURATION
# ============================================================

sonar.tests=libs,services,tests

sonar.test.inclusions=\
**/*.spec.ts,\
**/*.test.ts,\
**/*.spec.js,\
**/*.test.js

# ============================================================
# COVERAGE EXCLUSIONS
# ============================================================

sonar.coverage.exclusions=\
**/*.spec.ts,\
**/*.test.ts,\
**/*.spec.js,\
**/*.test.js,\
**/main.ts,\
**/index.ts,\
**/generated/**,\
**/web-e2e/**

# ============================================================
# JAVASCRIPT / TYPESCRIPT COVERAGE
# ============================================================

sonar.javascript.lcov.reportPaths=coverage/**/lcov.info
