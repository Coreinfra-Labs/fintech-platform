
---

### **PHASE 10: Docker Compose Update**

#### **UPDATE FILE:** `docker-compose.yml`
```yaml
version: '3.8'

services:
  # ... existing services ...

  # Transaction Service
  transaction-service:
    build:
      context: .
      dockerfile: services/transaction-service/Dockerfile
    ports:
      - "3003:3003"
    environment:
      DATABASE_URL: postgresql://fintech_user:fintech_secure_password@postgres:5432/fintech_db
      KAFKA_BROKERS: kafka:29092
      LEDGER_SERVICE_URL: http://ledger-service:3005/api/ledger
      JWT_SECRET: your-super-secret-jwt-key
    depends_on:
      - postgres
      - kafka
      - zookeeper
    networks:
      - fintech-network

  # Fraud Service
  fraud-service:
    build:
      context: .
      dockerfile: services/fraud-service/Dockerfile
    ports:
      - "3005:3005"
    environment:
      DATABASE_URL: postgresql://fintech_user:fintech_secure_password@postgres:5432/fintech_db
      KAFKA_BROKERS: kafka:29092
      FRAUD_THRESHOLD: 500000
      HIGH_RISK_THRESHOLD: 50
    depends_on:
      - postgres
      - kafka
      - zookeeper
    networks:
      - fintech-network

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "3006:3006"
    environment:
      KAFKA_BROKERS: kafka:29092
      EMAIL_USER: noreply@fintech.com
      EMAIL_PASSWORD: your-app-password
      TWILIO_ACCOUNT_SID: your-twilio-sid
      TWILIO_AUTH_TOKEN: your-twilio-token
      TWILIO_PHONE: +1234567890
      USER_SERVICE_URL: http://user-service:3001
    depends_on:
      - kafka
      - zookeeper
    networks:
      - fintech-network

  # Payment Service (Kafka removed)
  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    ports:
      - "3004:3004"
    environment:
      DATABASE_URL: postgresql://fintech_user:fintech_secure_password@postgres:5432/fintech_db
      NIBSS_API_URL: http://nibss-mock:3007
    depends_on:
      - postgres
    networks:
      - fintech-network

  # Wallet Service (Kafka removed)
  wallet-service:
    build:
      context: .
      dockerfile: services/wallet-service/Dockerfile
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://fintech_user:fintech_secure_password@postgres:5432/fintech_db
    depends_on:
      - postgres
    networks:
      - fintech-network

  # Kafka (unchanged)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - fintech-network

  # Zookeeper (unchanged)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - fintech-network

  # Kafka UI (unchanged)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
      - zookeeper
    networks:
      - fintech-network

networks:
  fintech-network:
    driver: bridge
