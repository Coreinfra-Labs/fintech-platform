name: Security - Scheduled

on:
  # ==========================================================
  # DAILY SECURITY SCAN
  #
  # Detect newly disclosed vulnerabilities even when there
  # has been no code change.
  # ==========================================================

  schedule:
    - cron: "0 2 * * *"

  # Allow manual execution
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:

  # ==========================================================
  # SOFTWARE COMPOSITION ANALYSIS
  #
  # Scan current dependencies against current vulnerability
  # intelligence.
  #
  # IMPORTANT:
  # The vulnerability database may be cached.
  # The security result is NOT cached.
  # ==========================================================

  sca:
    name: Scheduled SCA Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Trivy vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}
          restore-keys: |
            trivy-db-

      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: 1


  # ==========================================================
  # PNPM AUDIT
  #
  # Second dependency intelligence source.
  # ==========================================================

  pnpm-audit:
    name: Scheduled pnpm Audit
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.8.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level=high