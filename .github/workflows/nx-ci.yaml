
name: nx-ci

on:
  workflow_call:
    inputs:
      full_ci:
        description: Run CI for all Nx projects
        required: false
        default: false
        type: boolean

  workflow_dispatch:
    inputs:
      full_ci:
        description: "Run CI for all Nx projects"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  main:
    name: Nx CI
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # CHECKOUT
      # ============================================

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: tree:0
          fetch-depth: 0

      # ============================================
      # NODE
      # ============================================

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 23.3.0

      # ============================================
      # PNPM
      # ============================================

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.8.0
          run_install: false

      # ============================================
      # PNPM CACHE
      # ============================================

      - name: Enable pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 23.3.0
          cache: pnpm

      # ============================================
      # INSTALL
      # ============================================

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ============================================
      # PLAYWRIGHT
      # ============================================

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium firefox msedge

      # ============================================
      # NX SHAS
      # ============================================

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5

      # ============================================
      # NX CLOUD (TEMPORARILY DISABLED)
      # ============================================

      # Re-enable this step when Nx Cloud is available.
      # - name: Start Nx Cloud CI
      #   run: |
      #     pnpm exec nx start-ci-run \
      #       --distribute-on=".nx/workflows/distribution-config.yaml" \
      #       --stop-agents-after="e2e"

      # ============================================
      # FULL CI
      # ============================================

      - name: Run full monorepo CI
        if: inputs.full_ci
        run: |
          pnpm nx run-many \
            -t lint,test-ci,typecheck,build \
            --all \
            --no-cloud

      # ============================================
      # FULL E2E
      # ============================================

      - name: Run all E2E tests
        if: inputs.full_ci
        run: |
          pnpm nx run-many \
            -t e2e \
            --all \
            --no-cloud

      # ============================================
      # AFFECTED CI
      # ============================================

      - name: Run affected CI
        if: ${{ !inputs.full_ci }}
        run: |
          pnpm nx affected \
            -t lint,test-ci,typecheck,build \
            --no-cloud

      # ============================================
      # AFFECTED E2E
      # ============================================

      # Nx Cloud is disabled, so this workflow has no Nx CI finalizer.
      - name: Run affected E2E
        if: ${{ !inputs.full_ci }}
        run: |
          pnpm nx affected \
            -t e2e \
            --no-cloud
