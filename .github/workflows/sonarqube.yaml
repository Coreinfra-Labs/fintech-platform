
name: SAST-SonarQube

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sonarqube:
    name: SonarQube SAST Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::517714604478:role/GitHubAction-AssumeRoleWithAction
          aws-region: us-east-1
          role-session-name: GitHubActions-SonarQube

      # 3. Verify AWS identity
      - name: Verify AWS Identity
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)

          if [[ "$ACCOUNT" != "517714604478" ]]; then
            echo "ERROR: Unexpected AWS account."
            exit 1
          fi

          echo "AWS authentication successful."

      # 4. Retrieve SonarQube credentials
      - name: Retrieve SonarQube Credentials
        id: sonar-secrets
        shell: bash
        run: |
          set -euo pipefail

          REGION="us-east-1"

          TOKEN_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id sonar/sonarqube/token \
            --region "$REGION" \
            --query SecretString \
            --output text)

          SONAR_TOKEN=$(echo "$TOKEN_SECRET" | jq -er \
            '."sonar/sonarqube/token"')

          URL_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id sonar/sonarqube/url \
            --region "$REGION" \
            --query SecretString \
            --output text)

          SONAR_HOST_URL=$(echo "$URL_SECRET" | jq -er \
            '."sonar/sonarqube/url"')

          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "ERROR: SonarQube token is empty."
            exit 1
          fi

          # Accept HTTP for current testing and HTTPS for production.
          python3 - "$SONAR_HOST_URL" <<'PY'
          import sys
          from urllib.parse import urlparse

          url = urlparse(sys.argv[1])

          if url.scheme not in ("http", "https") or not url.hostname:
              raise SystemExit("ERROR: Invalid SonarQube URL")

          print("SonarQube URL validation successful.")
          PY

          echo "::add-mask::$SONAR_TOKEN"

          {
            echo "sonar_token=$SONAR_TOKEN"
            echo "sonar_url=$SONAR_HOST_URL"
          } >> "$GITHUB_OUTPUT"

          unset TOKEN_SECRET SONAR_TOKEN URL_SECRET SONAR_HOST_URL

          echo "SonarQube credentials retrieved successfully."

      # 5. Verify SonarQube connectivity
      - name: Verify SonarQube Connectivity
        shell: bash
        env:
          SONAR_HOST_URL: ${{ steps.sonar-secrets.outputs.sonar_url }}
        run: |
          set -euo pipefail

          echo "Checking SonarQube server..."

          RESPONSE=$(curl --fail \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            "$SONAR_HOST_URL/api/system/status")

          STATUS=$(echo "$RESPONSE" | jq -er '.status')
          VERSION=$(echo "$RESPONSE" | jq -er '.version')

          echo "SonarQube version: $VERSION"
          echo "SonarQube status: $STATUS"

          if [[ "$STATUS" != "UP" ]]; then
            echo "ERROR: SonarQube server is not UP."
            exit 1
          fi

          echo "SonarQube connectivity successful."

      # 6. Run SonarQube SAST analysis and enforce Quality Gate
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ steps.sonar-secrets.outputs.sonar_token }}
          SONAR_HOST_URL: ${{ steps.sonar-secrets.outputs.sonar_url }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      # 7. Report success
      - name: Report Successful Analysis
        if: success()
        run: |
          echo "SonarQube analysis completed successfully."
          echo "Quality Gate passed."

      # 8. Report failure
      - name: Report Pipeline Failure
        if: failure()
        run: |
          echo "SonarQube pipeline failed."
          echo "Inspect the failed step above."
