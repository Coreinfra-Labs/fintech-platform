
name: SAST-SonarQube

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sonarqube:
    name: SonarQube SAST Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Authenticate to AWS using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::517714604478:role/GitHubAction-AssumeRoleWithAction
          aws-region: us-east-1
          role-session-name: GitHubActions-SonarQube

      # 3. Verify AWS identity
      - name: Verify AWS Identity
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)

          if [[ "$ACCOUNT" != "517714604478" ]]; then
            echo "::error::Unexpected AWS account."
            exit 1
          fi

          echo "AWS authentication successful."

      # 4. Retrieve SonarQube credentials
      - name: Retrieve SonarQube Credentials
        id: sonar-secrets
        shell: bash
        run: |
          set -euo pipefail

          REGION="us-east-1"

          TOKEN_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id sonar/sonarqube/token \
            --region "$REGION" \
            --query SecretString \
            --output text)

          SONAR_TOKEN=$(jq -er \
            '."sonar/sonarqube/token" | select(type == "string" and length > 0)' \
            <<< "$TOKEN_SECRET")

          URL_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id sonar/sonarqube/url \
            --region "$REGION" \
            --query SecretString \
            --output text)

          SONAR_HOST_URL=$(jq -er \
            '."sonar/sonarqube/url" | select(type == "string" and length > 0)' \
            <<< "$URL_SECRET")

          python3 - "$SONAR_HOST_URL" <<'PY'
          import sys
          from urllib.parse import urlparse

          parsed = urlparse(sys.argv[1])

          if parsed.scheme not in ("http", "https") or not parsed.hostname:
              raise SystemExit("Invalid SonarQube URL.")

          print("SonarQube URL validated.")
          PY

          echo "::add-mask::$SONAR_TOKEN"

          {
            echo "sonar_token=$SONAR_TOKEN"
            echo "sonar_url=$SONAR_HOST_URL"
          } >> "$GITHUB_OUTPUT"

          unset TOKEN_SECRET URL_SECRET SONAR_TOKEN SONAR_HOST_URL

          echo "SonarQube credentials retrieved successfully."

      # 5. Verify SonarQube API
      - name: Verify SonarQube Connectivity
        shell: bash
        env:
          SONAR_HOST_URL: ${{ steps.sonar-secrets.outputs.sonar_url }}
        run: |
          set -euo pipefail

          echo "Checking SonarQube API..."

          RESPONSE=$(mktemp)
          HEADERS=$(mktemp)
          trap 'rm -f "$RESPONSE" "$HEADERS"' EXIT

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --max-redirs 0 \
            --dump-header "$HEADERS" \
            --output "$RESPONSE" \
            --write-out "%{http_code}" \
            --header "Accept: application/json" \
            "$SONAR_HOST_URL/api/system/status")

          echo "HTTP Status: $HTTP_STATUS"

          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "::error::Unexpected HTTP status: $HTTP_STATUS"
            cat "$HEADERS"
            head -c 500 "$RESPONSE"
            exit 1
          fi

          if ! jq -e '
            (.status | type == "string") and
            (.version | type == "string")
          ' "$RESPONSE" >/dev/null 2>&1; then
            echo "::error::Expected SonarQube JSON but received another response."
            echo "Response headers:"
            cat "$HEADERS"
            echo "Response preview:"
            head -c 500 "$RESPONSE"
            exit 1
          fi

          STATUS=$(jq -r '.status' "$RESPONSE")
          VERSION=$(jq -r '.version' "$RESPONSE")

          echo "SonarQube Version: $VERSION"
          echo "SonarQube Status: $STATUS"

          if [[ "$STATUS" != "UP" ]]; then
            echo "::error::SonarQube is not operational."
            exit 1
          fi

          echo "SonarQube API connectivity successful."

      # 6. Run SonarQube SAST scan and enforce Quality Gate
      - name: SonarQube SAST Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ steps.sonar-secrets.outputs.sonar_token }}
          SONAR_HOST_URL: ${{ steps.sonar-secrets.outputs.sonar_url }}
        with:
          args: >
            -Dsonar.projectKey=fintech-platform
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      # 7. Report success
      - name: Report Successful Analysis
        if: success()
        run: |
          echo "SonarQube SAST analysis completed."
          echo "Quality Gate passed."

      # 8. Report failure
      - name: Report Pipeline Failure
        if: failure()
        run: |
          echo "::error::SonarQube pipeline failed."
          echo "Inspect the failed step above."
