
name: SAST-SonarQube

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube SAST Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ======================================================
      # 1. CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # 2. AUTHENTICATE TO AWS USING OIDC
      # ======================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::517714604478:role/GitHubAction-AssumeRoleWithAction
          aws-region: us-east-1
          role-session-name: GitHubActions-SonarQube

      # ======================================================
      # 3. VERIFY AWS AUTHENTICATION
      # ======================================================

      - name: Verify AWS Identity
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying AWS identity..."

          IDENTITY=$(aws sts get-caller-identity)

          echo "$IDENTITY" | jq '{
            Account: .Account,
            Arn: .Arn
          }'

          ACCOUNT=$(echo "$IDENTITY" | jq -r '.Account')

          if [[ "$ACCOUNT" != "517714604478" ]]; then
            echo "::error::Unexpected AWS account."
            exit 1
          fi

          echo "AWS authentication successful."

      # ======================================================
      # 4. RETRIEVE SONARQUBE CREDENTIALS
      # ======================================================

      - name: Retrieve SonarQube Credentials
        id: sonar-secrets
        shell: bash
        run: |
          set -euo pipefail

          REGION="us-east-1"

          echo "Retrieving SonarQube credentials..."

          TOKEN_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id sonar/sonarqube/token \
            --region "$REGION" \
            --query SecretString \
            --output text)

          SONAR_TOKEN=$(jq -er \
            '."sonar/sonarqube/token" | select(type == "string" and length > 0)' \
            <<< "$TOKEN_SECRET")

          URL_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id sonar/sonarqube/url \
            --region "$REGION" \
            --query SecretString \
            --output text)

          SONAR_HOST_URL=$(jq -er \
            '."sonar/sonarqube/url" | select(type == "string" and length > 0)' \
            <<< "$URL_SECRET")

          # Validate SonarQube URL
          python3 - "$SONAR_HOST_URL" <<'PY'
          import sys
          from urllib.parse import urlparse

          parsed = urlparse(sys.argv[1])

          if parsed.scheme not in ("http", "https"):
              raise SystemExit("Invalid SonarQube URL scheme.")

          if not parsed.hostname:
              raise SystemExit("SonarQube hostname is missing.")

          print("SonarQube URL validation successful.")
          PY

          # Mask credentials in GitHub Actions logs
          echo "::add-mask::$SONAR_TOKEN"

          # Export credentials to subsequent steps
          {
            echo "sonar_token=$SONAR_TOKEN"
            echo "sonar_url=$SONAR_HOST_URL"
          } >> "$GITHUB_OUTPUT"

          unset TOKEN_SECRET URL_SECRET SONAR_TOKEN SONAR_HOST_URL
          unset TOKEN_SECRET URL_SECRET

          echo "SonarQube credentials retrieved successfully."

      # ======================================================
      # 5. VERIFY SONARQUBE SERVER CONNECTIVITY
      # ======================================================

      - name: Verify SonarQube Connectivity
        shell: bash
        env:
          SONAR_HOST_URL: ${{ steps.sonar-secrets.outputs.sonar_url }}
        run: |
          set -euo pipefail

          echo "Checking SonarQube server..."

          RESPONSE=$(mktemp)
          trap 'rm -f "$RESPONSE"' EXIT

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --output "$RESPONSE" \
            --write-out "%{http_code}" \
            "$SONAR_HOST_URL/api/system/status")

          echo "HTTP Status: $HTTP_STATUS"

          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "::error::SonarQube returned HTTP $HTTP_STATUS"
            head -c 500 "$RESPONSE"
            exit 1
          fi

          if ! jq -e '
            (.status | type == "string") and
            (.version | type == "string")
          ' "$RESPONSE" >/dev/null 2>&1; then
            echo "::error::Invalid SonarQube JSON response."
            head -c 500 "$RESPONSE"
            exit 1
          fi

          STATUS=$(jq -r '.status' "$RESPONSE")
          VERSION=$(jq -r '.version' "$RESPONSE")

          echo "SonarQube Version: $VERSION"
          echo "SonarQube Status: $STATUS"

          if [[ "$STATUS" != "UP" ]]; then
            echo "::error::SonarQube server is not UP."
            exit 1
          fi

          echo "SonarQube connectivity successful."

      # ======================================================
      # 6. RUN SONARQUBE SAST ANALYSIS
      # ======================================================

      - name: SonarQube SAST Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ steps.sonar-secrets.outputs.sonar_token }}
          SONAR_HOST_URL: ${{ steps.sonar-secrets.outputs.sonar_url }}
        with:
          args: >
            -Dsonar.projectKey=fintech-platform
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      # ======================================================
      # 7. REPORT SUCCESS
      # ======================================================

      - name: Report Successful Analysis
        if: success()
        shell: bash
        run: |
          echo "============================================"
          echo " SONARQUBE PIPELINE COMPLETED SUCCESSFULLY"
          echo "============================================"
          echo "AWS OIDC              : SUCCESS"
          echo "AWS Secrets Manager   : SUCCESS"
          echo "SonarQube Connectivity: SUCCESS"
          echo "SAST Analysis         : SUCCESS"
          echo "Quality Gate          : PASSED"
          echo "============================================"

      # ======================================================
      # 8. REPORT FAILURE
      # ======================================================

      - name: Report Pipeline Failure
        if: failure()
        shell: bash
        run: |
          echo "============================================"
          echo " SONARQUBE PIPELINE FAILED"
          echo "============================================"
          echo "Review the failed workflow step."
          echo "============================================"
