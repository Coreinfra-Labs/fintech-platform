
name: SAST-SonarQube

on:
  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sonar:
    name: Trusted SonarQube Security Scan
    runs-on: ubuntu-latest

    steps:
      # STEP 1: CHECKOUT REPOSITORY
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # STEP 2: DEBUG GITHUB OIDC CLAIMS
      - name: Debug GitHub OIDC Subject
        shell: bash
        run: |
          set -euo pipefail

          echo "Requesting GitHub OIDC token..."

          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -er '.value')
          export TOKEN

          python3 - <<'PY'
          import os
          import json
          import base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("\n========== GITHUB OIDC CLAIMS ==========")

          for key in [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_id",
              "repository_owner_id",
              "ref",
              "environment"
          ]:
              print(f"{key}: {claims.get(key)}")

          print("=========================================\n")
          PY

          unset TOKEN

      # STEP 3: CONFIGURE AWS CREDENTIALS USING OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::517714604478:role/GitHubAction-AssumeRoleWithAction
          aws-region: us-east-1
          role-session-name: GitHubActions-SonarQube

      # STEP 4: VERIFY AWS IDENTITY
      - name: Verify AWS Identity
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying AWS identity..."

          aws sts get-caller-identity

      # STEP 5: RETRIEVE SONARQUBE SECRETS
      - name: Retrieve SonarQube Credentials
        shell: bash
        run: |
          set -euo pipefail

          echo "Retrieving SonarQube credentials..."

          TOKEN_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id sonar/sonarqube/token \
            --region us-east-1 \
            --query SecretString \
            --output text)

          SONAR_TOKEN=$(echo "$TOKEN_SECRET" | jq -er \
            '."sonar/sonarqube/token"')

          URL_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id sonar/sonarqube/url \
            --region us-east-1 \
            --query SecretString \
            --output text)

          SONAR_HOST_URL=$(echo "$URL_SECRET" | jq -er \
            '."sonar/sonarqube/url"')

          test -n "$SONAR_TOKEN"
          test -n "$SONAR_HOST_URL"

          echo "::add-mask::$SONAR_TOKEN"

          {
            echo "SONAR_TOKEN=$SONAR_TOKEN"
            echo "SONAR_HOST_URL=$SONAR_HOST_URL"
          } >> "$GITHUB_ENV"

          unset TOKEN_SECRET SONAR_TOKEN URL_SECRET SONAR_HOST_URL

          echo "SonarQube credentials retrieved successfully."

      # STEP 6: VERIFY SONARQUBE CONNECTIVITY
      - name: Verify SonarQube Connectivity
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking SonarQube connectivity..."

          curl --fail \
            --silent \
            --show-error \
            --max-time 30 \
            "$SONAR_HOST_URL/api/system/status"

          echo ""
          echo "SonarQube connectivity check completed."

      # STEP 7: RUN SONARQUBE SAST SCAN
      - name: Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      # STEP 8: REPORT FINAL RESULT
      - name: SonarQube Scan Result
        if: success()
        shell: bash
        run: |
          echo "========================================="
          echo " SonarQube SAST completed successfully"
          echo " Quality Gate passed"
          echo "========================================="

      - name: Report Pipeline Failure
        if: failure()
        shell: bash
        run: |
          echo "========================================="
          echo " SonarQube pipeline failed"
          echo " Check the failed step and workflow logs"
          echo "========================================="
