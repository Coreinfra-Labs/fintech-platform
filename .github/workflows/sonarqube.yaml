
name: SAST-SonarQube

on:
  push:
    branches:
      - develop

  workflow_dispatch:

# --------------------------------------------------
# WORKFLOW PERMISSIONS
# --------------------------------------------------

permissions:
  id-token: write
  contents: read

# --------------------------------------------------
# JOBS
# --------------------------------------------------

jobs:
  sonarqube-sast:

    name: SonarQube SAST Analysis
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # --------------------------------------------------
      # STEP 1: CHECKOUT REPOSITORY
      # --------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # STEP 2: DEBUG GITHUB OIDC SUBJECT
      # --------------------------------------------------

      - name: Debug GitHub OIDC Subject
        shell: bash
        run: |
          set -euo pipefail

          echo "Requesting GitHub OIDC token..."

          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --get \
            --data-urlencode "audience=sts.amazonaws.com" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")

          TOKEN=$(echo "$RESPONSE" | jq -er '.value')

          export TOKEN

          python3 - <<'PY'
          import os
          import json
          import base64

          token = os.environ["TOKEN"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("\n========== GITHUB OIDC CLAIMS ==========")

          for key in [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_id",
              "repository_owner_id",
              "ref",
              "environment"
          ]:
              print(f"{key}: {claims.get(key)}")

          print("=========================================\n")

          assert claims.get("iss") == \
              "https://token.actions.githubusercontent.com", \
              "Unexpected OIDC issuer"

          assert claims.get("aud") == "sts.amazonaws.com", \
              "Unexpected OIDC audience"

          assert claims.get("repository") == \
              "Coreinfra-Labs/fintech-platform", \
              "Unexpected GitHub repository"

          assert claims.get("ref") == \
              "refs/heads/develop", \
              "Unexpected Git branch"

          print("OIDC claim validation successful.")
          PY

          unset TOKEN

      # --------------------------------------------------
      # STEP 3: AUTHENTICATE TO AWS USING OIDC
      # --------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::517714604478:role/GitHubAction-AssumeRoleWithAction
          aws-region: us-east-1
          role-session-name: GitHubActions-SonarQube

      # --------------------------------------------------
      # STEP 4: VERIFY AWS IDENTITY
      # --------------------------------------------------

      - name: Verify AWS Identity
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying AWS identity..."

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          aws sts get-caller-identity

          if [ "$ACCOUNT_ID" != "517714604478" ]; then
            echo "Unexpected AWS account."
            exit 1
          fi

          echo "AWS OIDC authentication successful."
          echo "AWS account validation successful."

      # --------------------------------------------------
      # STEP 5: RETRIEVE SONARQUBE CREDENTIALS
      # --------------------------------------------------

      - name: Retrieve SonarQube Credentials
        id: sonar_secrets
        shell: bash
        run: |
          set -euo pipefail

          echo "Retrieving SonarQube credentials..."

          TOKEN_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id sonar/sonarqube/token \
            --region us-east-1 \
            --query SecretString \
            --output text)

          SONAR_TOKEN=$(echo "$TOKEN_SECRET" | jq -er \
            '."sonar/sonarqube/token"')

          URL_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id sonar/sonarqube/url \
            --region us-east-1 \
            --query SecretString \
            --output text)

          SONAR_HOST_URL=$(echo "$URL_SECRET" | jq -er \
            '."sonar/sonarqube/url"')

          test -n "$SONAR_TOKEN"
          test -n "$SONAR_HOST_URL"

          case "$SONAR_HOST_URL" in
            https://*) ;;
            *)
              echo "SonarQube URL must use HTTPS."
              exit 1
              ;;
          esac

          echo "::add-mask::$SONAR_TOKEN"

          {
            echo "sonar_token=$SONAR_TOKEN"
            echo "sonar_url=$SONAR_HOST_URL"
          } >> "$GITHUB_OUTPUT"

          unset TOKEN_SECRET SONAR_TOKEN
          unset URL_SECRET SONAR_HOST_URL

          echo "SonarQube credentials retrieved successfully."

      # --------------------------------------------------
      # STEP 6: VERIFY SONARQUBE CONNECTIVITY
      # --------------------------------------------------

      - name: Verify SonarQube Connectivity
        shell: bash
        env:
          SONAR_HOST_URL: ${{ steps.sonar_secrets.outputs.sonar_url }}
        run: |
          set -euo pipefail

          echo "Checking SonarQube connectivity..."

          RESPONSE=$(curl --fail \
            --silent \
            --show-error \
            --max-time 30 \
            "$SONAR_HOST_URL/api/system/status")

          echo "SonarQube server responded successfully."

          echo "$RESPONSE" | jq '{status: .status}'

          STATUS=$(echo "$RESPONSE" | jq -er '.status')

          if [ "$STATUS" != "UP" ]; then
            echo "SonarQube server is not UP."
            exit 1
          fi

          echo "SonarQube connectivity successful."

      # --------------------------------------------------
      # STEP 7: RUN SONARQUBE SAST SCAN
      # --------------------------------------------------

      - name: Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ steps.sonar_secrets.outputs.sonar_token }}
          SONAR_HOST_URL: ${{ steps.sonar_secrets.outputs.sonar_url }}
        with:
          args: >
            -Dsonar.projectKey=fintech-platform
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      # --------------------------------------------------
      # STEP 8: REPORT SUCCESS
      # --------------------------------------------------

      - name: SonarQube Scan Successful
        if: success()
        shell: bash
        run: |
          echo "========================================="
          echo " SONARQUBE PIPELINE COMPLETED"
          echo "========================================="
          echo "Repository Checkout: SUCCESS"
          echo "GitHub OIDC Validation: SUCCESS"
          echo "AWS OIDC Authentication: SUCCESS"
          echo "AWS Account Verification: SUCCESS"
          echo "Secrets Manager: SUCCESS"
          echo "SonarQube Connectivity: SUCCESS"
          echo "SonarQube Analysis: SUCCESS"
          echo "Quality Gate: PASSED"
          echo "========================================="

      # --------------------------------------------------
      # STEP 9: REPORT FAILURE
      # --------------------------------------------------

      - name: SonarQube Pipeline Failed
        if: failure()
        shell: bash
        run: |
          echo "========================================="
          echo " SONARQUBE PIPELINE FAILED"
          echo "========================================="
          echo "One or more pipeline steps failed."
          echo "Check the failed workflow step."
          echo "Review the GitHub Actions logs."
          echo "========================================="
