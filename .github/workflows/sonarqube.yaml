name: SAST-SonarQube

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:

  # Job 1: Untrusted branch and PR validation
  pr-validation:
    name: Feature Branch / PR Validation
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'push' &&
        github.ref != 'refs/heads/main' &&
        github.ref != 'refs/heads/develop'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Git changes
        run: |
          git diff --check

      - name: Validation completed
        run: echo "Basic validation completed successfully."

  # Job 2: Trusted AWS OIDC and SonarQube scan
  sonar:
    name: Trusted SonarQube Security Scan
    runs-on: ubuntu-latest

    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials for OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::517714604478:role/GitHubAction-AssumeRoleWithAction
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Read Sonar credentials from AWS Secrets Manager
        shell: bash
        run: |
          set -euo pipefail

          SONAR_TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id sonar/sonarqube/token \
            --region us-east-1 \
            --query SecretString \
            --output text | jq -er '.token')

          SONAR_HOST_URL=$(aws secretsmanager get-secret-value \
            --secret-id sonar/sonarqube/url \
            --region us-east-1 \
            --query SecretString \
            --output text | jq -er '.url')

          echo "::add-mask::$SONAR_TOKEN"

          {
            echo "SONAR_TOKEN=$SONAR_TOKEN"
            echo "SONAR_HOST_URL=$SONAR_HOST_URL"
          } >> "$GITHUB_ENV"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
