name: SAST-SonarQube

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: SonarQube SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.8.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials for OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::858404480358:role/GitHubAction-AssumeRoleWithAction
          aws-region: eu-north-1
          audience: sts.amazonaws.com

      - name: Read Sonar credentials from AWS Secrets Manager
        shell: bash
        run: |
          set -euo pipefail

          SONAR_TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id sonar/sonarqube/token \
            --query SecretString \
            --output text | jq -r '.token')

          SONAR_HOST_URL=$(aws secretsmanager get-secret-value \
            --secret-id sonar/sonarqube/url \
            --query SecretString \
            --output text | jq -r '.url')

          echo "SONAR_TOKEN=$SONAR_TOKEN" >> "$GITHUB_ENV"
          echo "SONAR_HOST_URL=$SONAR_HOST_URL" >> "$GITHUB_ENV"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

