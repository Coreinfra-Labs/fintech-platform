name: CI Security Gate

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:
    inputs:
      full_ci:
        description: Run CI for all Nx projects
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write

jobs:
  nx-ci:
    name: Nx CI
    uses: ./.github/workflows/nx-ci.yaml
    with:
      full_ci: ${{ inputs.full_ci || false }}

  sonar:
    name: SonarQube
    uses: ./.github/workflows/sonar.yml
    secrets: inherit

  gitleaks:
    name: Gitleaks
    uses: ./.github/workflows/gitleaks.yaml
    secrets: inherit

  sca-trivy:
    name: Dependency Security Scan
    uses: ./.github/workflows/security/sca-trivy.yml
    secrets: inherit

  security-gate:
    name: Security Gate
    needs:
      - nx-ci
      - sonar
      - gitleaks
      - sca-trivy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          NX_CI_RESULT: ${{ needs.nx-ci.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          SCA_RESULT: ${{ needs.sca-trivy.result }}
        run: |
          printf 'Nx CI: %s\n' "$NX_CI_RESULT"
          printf 'SonarQube: %s\n' "$SONAR_RESULT"
          printf 'Gitleaks: %s\n' "$GITLEAKS_RESULT"
          printf 'Dependency scan: %s\n' "$SCA_RESULT"

          if [[ "$NX_CI_RESULT" != "success" || \
                "$SONAR_RESULT" != "success" || \
                "$GITLEAKS_RESULT" != "success" || \
                "$SCA_RESULT" != "success" ]]; then
            echo "CI Security Gate FAILED"
            exit 1
          fi

          echo "CI Security Gate PASSED"