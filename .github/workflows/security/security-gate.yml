name: CI Security Gate

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:
    inputs:
      full_ci:
        description: Run CI for all Nx projects
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write

jobs:
  nx-ci:
    name: Nx CI
    uses: ./.github/workflows/nx-ci.yaml
    with:
      full_ci: ${{ inputs.full_ci || false }}

  # Fork PRs do not receive upstream secrets or OIDC tokens.
  # Keep these credential-dependent scans out of the untrusted fork workflow context.
  sonar:
    name: SonarQube
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    uses: ./.github/workflows/sonarqube.yaml
    secrets: inherit
    permissions:
      id-token: write
      contents: read
      pull-requests: read

  gitleaks:
    name: Gitleaks
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    uses: ./.github/workflows/gitleaks.yaml
    secrets: inherit

  sca-trivy:
    name: Dependency Security Scan
    uses: ./.github/workflows/security/sca-trivy.yml
    secrets: inherit

  security-gate:
    name: Security Gate
    needs:
      - nx-ci
      - sonar
      - gitleaks
      - sca-trivy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require checks appropriate to the PR trust context
        env:
          NX_CI_RESULT: ${{ needs.nx-ci.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          SCA_RESULT: ${{ needs.sca-trivy.result }}
          PR_IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        shell: bash
        run: |
          set -euo pipefail

          printf 'Nx CI: %s\n' "$NX_CI_RESULT"
          printf 'SonarQube: %s\n' "$SONAR_RESULT"
          printf 'Gitleaks: %s\n' "$GITLEAKS_RESULT"
          printf 'Dependency scan: %s\n' "$SCA_RESULT"
          printf 'PR from fork: %s\n' "$PR_IS_FORK"

          if [[ "$PR_IS_FORK" == "true" ]]; then
            if [[ "$NX_CI_RESULT" != "success" || "$SCA_RESULT" != "success" ]]; then
              echo "Fork PR Security Gate FAILED: Nx CI and dependency scanning must pass."
              exit 1
            fi

            if [[ "$SONAR_RESULT" != "skipped" || "$GITLEAKS_RESULT" != "skipped" ]]; then
              echo "Fork PR Security Gate FAILED: credential-dependent scans must be skipped for fork PRs."
              exit 1
            fi

            echo "Fork PR checks passed. NOTICE: SonarQube and licensed Gitleaks were skipped because fork PR workflows cannot access upstream OIDC or secrets. These scans are not covered by this gate for fork PRs."
            exit 0
          fi

          if [[ "$NX_CI_RESULT" != "success" || \
                "$SONAR_RESULT" != "success" || \
                "$GITLEAKS_RESULT" != "success" || \
                "$SCA_RESULT" != "success" ]]; then
            echo "CI Security Gate FAILED"
            exit 1
          fi

          echo "CI Security Gate PASSED"
