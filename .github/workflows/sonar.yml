
name: SAST-SonarQube

on:
  push:
    branches:
      - main
      - develop

  workflow_dispatch:

  workflow_call:

  schedule:
    - cron: "0 2 * * 1"

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: SonarQube SAST Analysis
    runs-on: ubuntu-latest

    environment: dev

    permissions:
      id-token: write
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Authenticate GitHub Actions with AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::517714604478:role/GitHubAction-AssumeRoleWithAction
          aws-region: us-east-1
          role-session-name: GitHubActions-SonarQube
          allowed-account-ids: "517714604478"

      # Verify AWS authentication
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # Retrieve SonarQube credentials from AWS Secrets Manager
      - name: Retrieve SonarQube credentials
        shell: bash
        run: |
          set -euo pipefail

          SONAR_TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id sonar/sonarqube/token \
            --query SecretString \
            --output text \
            --region us-east-1)

          SONAR_HOST_URL=$(aws secretsmanager get-secret-value \
            --secret-id sonar/sonarqube/url \
            --query SecretString \
            --output text \
            --region us-east-1)

          if [[ -z "$SONAR_TOKEN" || "$SONAR_TOKEN" == "None" ]]; then
            echo "SonarQube token is missing"
            exit 1
          fi

          if [[ -z "$SONAR_HOST_URL" || "$SONAR_HOST_URL" == "None" ]]; then
            echo "SonarQube URL is missing"
            exit 1
          fi

          echo "::add-mask::$SONAR_TOKEN"

          {
            echo "SONAR_TOKEN=$SONAR_TOKEN"
            echo "SONAR_HOST_URL=$SONAR_HOST_URL"
          } >> "$GITHUB_ENV"

      # Run SonarQube analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      # Evaluate Quality Gate
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
