
name: SAST-SonarQube

on:
  push:
    branches:
      - main
      - develop

  workflow_call:

  workflow_dispatch:

  schedule:
    - cron: "0 2 * * 1"

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: SonarQube SAST Analysis
    runs-on: ubuntu-latest

    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}

    steps:
      # Step 1: Checkout repository
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Debug GitHub OIDC claims
      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          OIDC_TOKEN=$(echo "$RESPONSE" | jq -er '.value')
          export OIDC_TOKEN

          python3 - <<'PY'
          import os
          import json
          import base64

          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          for key in [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_id",
              "repository_owner_id",
              "ref",
              "environment"
          ]:
              if key in claims:
                  print(f"{key}: {claims[key]}")
          PY

          unset OIDC_TOKEN

      # Step 3: Configure AWS credentials using OIDC
      - name: Configure AWS credentials for OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::517714604478:role/GitHubAction-AssumeRoleWithAction
          aws-region: us-east-1
          role-session-name: GitHubActions-SonarQube

      # Step 4: Verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # Step 5: Retrieve SonarQube credentials
      - name: Read SonarQube credentials from AWS Secrets Manager
        shell: bash
        run: |
          set -euo pipefail

          SONAR_TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id sonar/sonarqube/token \
            --query SecretString \
            --output text \
            --region us-east-1)

          SONAR_HOST_URL=$(aws secretsmanager get-secret-value \
            --secret-id sonar/sonarqube/url \
            --query SecretString \
            --output text \
            --region us-east-1)

          echo "::add-mask::$SONAR_TOKEN"

          {
            echo "SONAR_TOKEN=$SONAR_TOKEN"
            echo "SONAR_HOST_URL=$SONAR_HOST_URL"
          } >> "$GITHUB_ENV"

      # Step 6: Run SonarQube scan
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      # Step 7: Check SonarQube Quality Gate
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
