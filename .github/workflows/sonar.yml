
name: SAST-SonarQube

on:
  push:
    branches:
      - main
      - develop

  workflow_dispatch:

  workflow_call:

  schedule:
    - cron: "0 2 * * 1"

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: SonarQube OIDC Diagnostic
    runs-on: ubuntu-latest

    environment: dev

    permissions:
      id-token: write
      contents: read
      pull-requests: read

    steps:
      # Step 1: Checkout repository
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Debug GitHub OIDC claims
      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking GitHub OIDC environment variables..."

          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "OIDC request token is missing"
            exit 1
          fi

          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "OIDC request URL is missing"
            exit 1
          fi

          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          OIDC_TOKEN=$(echo "$RESPONSE" | jq -er '.value')
          export OIDC_TOKEN

          python3 - <<'PY'
          import os
          import json
          import base64

          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          for key in [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_id",
              "repository_owner_id",
              "ref",
              "environment"
          ]:
              if key in claims:
                  print(f"{key}: {claims[key]}")
          PY

          unset OIDC_TOKEN

          echo "OIDC diagnostic completed successfully."

      # AWS authentication temporarily disabled
      # We will restore this after checking the OIDC subject.

      # SonarQube steps temporarily disabled
      # They require AWS credentials.
