name: Deploy Staging

on:
  workflow_run:
    workflows:
      - Deploy Dev
    types:
      - completed

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: staging
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

  SOURCE_REPOSITORY: YOUR_ORG/YOUR-SOURCE-REPO
  GITOPS_REPOSITORY: YOUR_ORG/YOUR-GITOPS-REPO

  ARGOCD_SERVER: YOUR_ARGOCD_SERVER
  ARGOCD_APP_PREFIX: staging

jobs:

  promote:

    name: Promote Release To Staging

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'develop'

    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:

      #################################################
      # 1. Create GitHub App Installation Token
      #################################################

      - name: Create GitHub App Token
        id: github-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            YOUR-GITOPS-REPO
          permission-contents: write
          permission-actions: read

      #################################################
      # 2. Checkout Source Repository
      #################################################

      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: develop
          token: ${{ steps.github-app.outputs.token }}
          fetch-depth: 0

      #################################################
      # 3. Download Release Artifact
      #################################################

      - name: Download Release Metadata
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
          github-token: ${{ steps.github-app.outputs.token }}
          repository: ${{ env.SOURCE_REPOSITORY }}
          run-id: ${{ github.event.workflow_run.id }}

      #################################################
      # 4. Read Release Metadata
      #################################################

      - name: Read Release Metadata
        shell: bash
        run: |

          set -euo pipefail

          RELEASE_FILE="release/release.json"

          if [[ ! -f "$RELEASE_FILE" ]]; then
            echo "ERROR: Release metadata not found."
            echo "Expected: $RELEASE_FILE"
            exit 1
          fi

          SERVICE=$(jq -r '.service' "$RELEASE_FILE")
          VERSION=$(jq -r '.version' "$RELEASE_FILE")
          IMAGE_TAG=$(jq -r '.image_tag' "$RELEASE_FILE")
          DIGEST=$(jq -r '.digest' "$RELEASE_FILE")
          COMMIT=$(jq -r '.commit' "$RELEASE_FILE")
          RELEASE_ID=$(jq -r '.release_id' "$RELEASE_FILE")
          RELEASE_RUN_ID=$(jq -r '.release_run_id // empty' "$RELEASE_FILE")
          SOURCE_REPOSITORY_FROM_METADATA=$(jq -r '.source_repository // empty' "$RELEASE_FILE")
          SOURCE_BRANCH=$(jq -r '.source_branch // empty' "$RELEASE_FILE")

          for value in \
            SERVICE \
            VERSION \
            IMAGE_TAG \
            DIGEST \
            COMMIT \
            RELEASE_ID
          do
            if [[ -z "${!value}" || "${!value}" == "null" ]]; then
              echo "ERROR: Missing $value from release metadata."
              exit 1
            fi
          done

          echo "SERVICE=$SERVICE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "RELEASE_RUN_ID=$RELEASE_RUN_ID" >> "$GITHUB_ENV"
          echo "SOURCE_REPOSITORY_FROM_METADATA=$SOURCE_REPOSITORY_FROM_METADATA" >> "$GITHUB_ENV"
          echo "SOURCE_BRANCH=$SOURCE_BRANCH" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "STAGING RELEASE"
          echo "=============================================="
          echo "Release ID     : $RELEASE_ID"
          echo "Release Run ID : ${RELEASE_RUN_ID:-unknown}"
          echo "Service        : $SERVICE"
          echo "Version        : $VERSION"
          echo "Image Tag      : $IMAGE_TAG"
          echo "Digest         : $DIGEST"
          echo "Commit         : $COMMIT"
          echo "Source Branch  : ${SOURCE_BRANCH:-unknown}"
          echo "=============================================="

      #################################################
      # 5. Validate Release Identity
      #################################################

      - name: Validate Release Identity
        shell: bash
        run: |

          set -euo pipefail

          TRIGGER_RUN_ID="${{ github.event.workflow_run.id }}"

          if [[ -n "$RELEASE_RUN_ID" &&
                "$RELEASE_RUN_ID" != "$TRIGGER_RUN_ID" ]]; then

            echo "ERROR: Release run ID mismatch."
            echo "Metadata : $RELEASE_RUN_ID"
            echo "Trigger  : $TRIGGER_RUN_ID"
            exit 1
          fi

          if [[ -n "$SOURCE_REPOSITORY_FROM_METADATA" &&
                "$SOURCE_REPOSITORY_FROM_METADATA" != "$SOURCE_REPOSITORY" ]]; then

            echo "ERROR: Source repository mismatch."
            echo "Metadata : $SOURCE_REPOSITORY_FROM_METADATA"
            echo "Expected : $SOURCE_REPOSITORY"
            exit 1
          fi

          if [[ -n "$SOURCE_BRANCH" &&
                "$SOURCE_BRANCH" != "develop" ]]; then

            echo "ERROR: Release was not created from develop."
            echo "Branch: $SOURCE_BRANCH"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid release version."
            exit 1
          fi

          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "ERROR: Invalid image digest."
            exit 1
          fi

          if [[ ! "$COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "ERROR: Invalid source commit SHA."
            exit 1
          fi

          echo "Release identity validated."

      #################################################
      # 6. Verify Source Commit
      #################################################

      - name: Verify Source Commit
        shell: bash
        run: |

          set -euo pipefail

          git cat-file -e "$COMMIT^{commit}"

          echo "Source commit exists in repository:"
          echo "$COMMIT"

      #################################################
      # 7. Configure AWS Credentials
      #################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      #################################################
      # 8. Verify ECR Repository
      #################################################

      - name: Verify ECR Repository
        shell: bash
        run: |

          set -euo pipefail

          aws ecr describe-repositories \
            --repository-names "$SERVICE" \
            --region "$AWS_REGION" \
            > /dev/null

          echo "ECR repository verified:"
          echo "$SERVICE"

      #################################################
      # 9. Verify ECR Tag Immutability
      #################################################

      - name: Verify ECR Tag Immutability
        shell: bash
        run: |

          set -euo pipefail

          MUTABILITY=$(aws ecr describe-repositories \
            --repository-names "$SERVICE" \
            --region "$AWS_REGION" \
            --query 'repositories[0].imageTagMutability' \
            --output text)

          echo "Tag mutability: $MUTABILITY"

          if [[ "$MUTABILITY" != "IMMUTABLE" ]]; then
            echo "ERROR: ECR repository must use IMMUTABLE tags."
            exit 1
          fi

          echo "ECR immutability verified."

      #################################################
      # 10. Verify Exact ECR Digest
      #################################################

      - name: Verify ECR Digest
        shell: bash
        run: |

          set -euo pipefail

          VERIFIED_DIGEST=$(aws ecr describe-images \
            --repository-name "$SERVICE" \
            --image-ids imageDigest="$DIGEST" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [[ "$VERIFIED_DIGEST" != "$DIGEST" ]]; then
            echo "ERROR: ECR digest verification failed."
            echo "Expected: $DIGEST"
            echo "Actual  : $VERIFIED_DIGEST"
            exit 1
          fi

          echo "Exact digest verified:"
          echo "$SERVICE@$DIGEST"

      #################################################
      # 11. Verify Release Tag
      #################################################

      - name: Verify Release Tag
        shell: bash
        run: |

          set -euo pipefail

          TAG_DIGEST=$(aws ecr describe-images \
            --repository-name "$SERVICE" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [[ "$TAG_DIGEST" != "$DIGEST" ]]; then
            echo "ERROR: Release tag does not point to approved digest."
            echo "Tag digest     : $TAG_DIGEST"
            echo "Approved digest: $DIGEST"
            exit 1
          fi

          echo "Release tag verified:"
          echo "$SERVICE:$IMAGE_TAG"
          echo "$SERVICE@$DIGEST"

      #################################################
      # 12. Checkout GitOps Repository
      #################################################

      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          token: ${{ steps.github-app.outputs.token }}
          path: gitops
          fetch-depth: 0

      #################################################
      # 13. Update Staging GitOps
      #################################################

      - name: Update Staging GitOps Image
        shell: bash
        run: |

          set -euo pipefail

          python - <<'PY'
          import os
          from pathlib import Path
          import re

          service = os.environ["SERVICE"]
          image_tag = os.environ["IMAGE_TAG"]
          digest = os.environ["DIGEST"]

          file = Path(
              f"gitops/environments/staging/{service}/values.yaml"
          )

          if not file.exists():
              raise SystemExit(
                  f"GitOps values file does not exist: {file}"
              )

          text = file.read_text()

          text, tag_count = re.subn(
              r'(^\s*tag:\s*")[^"]*(")',
              rf'\g<1>{image_tag}\g<2>',
              text,
              count=1,
              flags=re.MULTILINE
          )

          text, digest_count = re.subn(
              r'(^\s*digest:\s*")[^"]*(")',
              rf'\g<1>{digest}\g<2>',
              text,
              count=1,
              flags=re.MULTILINE
          )

          if tag_count != 1:
              raise SystemExit(
                  f"Could not update image tag in {file}"
              )

          if digest_count != 1:
              raise SystemExit(
                  f"Could not update image digest in {file}"
              )

          file.write_text(text)

          print(f"Updated: {file}")
          print(f"Tag    : {image_tag}")
          print(f"Digest : {digest}")
          PY

      #################################################
      # 14. Verify GitOps Changes
      #################################################

      - name: Verify GitOps Changes
        working-directory: gitops
        shell: bash
        run: |

          set -euo pipefail

          FILE="environments/staging/${SERVICE}/values.yaml"

          echo "=============================================="
          echo "GITOPS DIFF"
          echo "=============================================="

          git diff -- "$FILE"

          if git diff --quiet -- "$FILE"; then
            echo "ERROR: No GitOps changes detected."
            exit 1
          fi

          echo "GitOps changes verified."

      #################################################
      # 15. Commit Staging GitOps Promotion
      #################################################

      - name: Commit Staging GitOps Promotion
        working-directory: gitops
        shell: bash
        run: |

          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "environments/staging/${SERVICE}/values.yaml"

          if git diff --cached --quiet; then
            echo "ERROR: Nothing to commit."
            exit 1
          fi

          git commit \
            -m "promote ${SERVICE} ${IMAGE_TAG} to staging"

          git push

          GITOPS_COMMIT=$(git rev-parse HEAD)

          echo "GITOPS_COMMIT=$GITOPS_COMMIT" >> "$GITHUB_ENV"

          echo "GitOps commit:"
          echo "$GITOPS_COMMIT"

      #################################################
      # 16. Install Argo CD CLI
      #################################################

      - name: Install Argo CD CLI
        shell: bash
        run: |

          set -euo pipefail

          curl -sSL \
            -o /tmp/argocd \
            "https://${ARGOCD_SERVER}/download/argocd-linux-amd64"

          install -m 0755 \
            /tmp/argocd \
            "$HOME/.local/bin/argocd"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          argocd version --client

      #################################################
      # 17. Determine Argo CD Application
      #################################################

      - name: Determine Argo CD Application
        shell: bash
        run: |

          set -euo pipefail

          ARGOCD_APP="${ARGOCD_APP_PREFIX}-${SERVICE}"

          echo "ARGOCD_APP=$ARGOCD_APP" >> "$GITHUB_ENV"

          echo "Argo CD application:"
          echo "$ARGOCD_APP"

      #################################################
      # 18. Wait For Argo CD Deployment
      #################################################

      - name: Wait For Argo CD Deployment
        shell: bash
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |

          set -euo pipefail

          if [[ -z "$ARGOCD_AUTH_TOKEN" ]]; then
            echo "ERROR: ARGOCD_AUTH_TOKEN is not configured."
            exit 1
          fi

          echo "Waiting for Argo CD:"
          echo "$ARGOCD_APP"

          argocd app wait "$ARGOCD_APP" \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --sync \
            --health \
            --timeout 600

          echo "Argo CD deployment completed."

      #################################################
      # 19. Verify Argo CD Application
      #################################################

      - name: Verify Argo CD Application
        shell: bash
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |

          set -euo pipefail

          STATUS=$(argocd app get "$ARGOCD_APP" \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            -o json)

          SYNC_STATUS=$(echo "$STATUS" | jq -r '.status.sync.status')
          HEALTH_STATUS=$(echo "$STATUS" | jq -r '.status.health.status')
          REVISION=$(echo "$STATUS" | jq -r '.status.sync.revision')

          echo "Application : $ARGOCD_APP"
          echo "Sync        : $SYNC_STATUS"
          echo "Health      : $HEALTH_STATUS"
          echo "Revision    : $REVISION"

          if [[ "$SYNC_STATUS" != "Synced" ]]; then
            echo "ERROR: Argo CD application is not Synced."
            exit 1
          fi

          if [[ "$HEALTH_STATUS" != "Healthy" ]]; then
            echo "ERROR: Argo CD application is not Healthy."
            exit 1
          fi

          echo "Argo CD application verified."

      #################################################
      # 20. Verify GitOps Revision
      #################################################

      - name: Verify GitOps Revision
        shell: bash
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |

          set -euo pipefail

          REVISION=$(argocd app get "$ARGOCD_APP" \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            -o json \
            | jq -r '.status.sync.revision')

          echo "Expected GitOps commit:"
          echo "$GITOPS_COMMIT"

          echo "Argo CD revision:"
          echo "$REVISION"

          if [[ "$REVISION" != "$GITOPS_COMMIT" ]]; then
            echo "ERROR: Argo CD is not synchronized to expected GitOps commit."
            exit 1
          fi

          echo "GitOps revision verified."

      #################################################
      # 21. Store Staging Release History
      #################################################

      - name: Store Staging Release History
        working-directory: gitops
        shell: bash
        run: |

          set -euo pipefail

          mkdir -p release-history

          cat <<EOF > \
            "release-history/staging-${SERVICE}-${VERSION}.json"
          {
            "release_id": "${RELEASE_ID}",
            "release_run_id": "${RELEASE_RUN_ID}",
            "service": "${SERVICE}",
            "version": "${VERSION}",
            "image_tag": "${IMAGE_TAG}",
            "digest": "${DIGEST}",
            "source_commit": "${COMMIT}",
            "gitops_commit": "${GITOPS_COMMIT}",
            "argocd_application": "${ARGOCD_APP}",
            "environment": "staging",
            "deployed_by": "${{ github.actor }}",
            "staging_workflow_run_id": "${GITHUB_RUN_ID}",
            "staging_workflow_run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "deployed_at": "$(date -u +%FT%TZ)"
          }
          EOF

      #################################################
      # 22. Commit Staging Release History
      #################################################

      - name: Commit Staging Release History
        working-directory: gitops
        shell: bash
        run: |

          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add release-history

          if git diff --cached --quiet; then
            echo "No release history changes."
            exit 0
          fi

          git commit \
            -m "record ${SERVICE} ${VERSION} staging deployment"

          git push

      #################################################
      # 23. Staging Deployment Summary
      #################################################

      - name: Staging Deployment Summary
        shell: bash
        run: |

          echo ""
          echo "=============================================="
          echo "STAGING DEPLOYMENT SUCCESSFUL"
          echo "=============================================="
          echo ""
          echo "Release ID:"
          echo "$RELEASE_ID"
          echo ""
          echo "Release Run ID:"
          echo "$RELEASE_RUN_ID"
          echo ""
          echo "Service:"
          echo "$SERVICE"
          echo ""
          echo "Version:"
          echo "$VERSION"
          echo ""
          echo "Image Tag:"
          echo "$IMAGE_TAG"
          echo ""
          echo "Source Commit:"
          echo "$COMMIT"
          echo ""
          echo "Immutable Digest:"
          echo "$DIGEST"
          echo ""
          echo "GitOps Commit:"
          echo "$GITOPS_COMMIT"
          echo ""
          echo "Argo CD Application:"
          echo "$ARGOCD_APP"
          echo ""
          echo "=============================================="
          echo "BUILD ONCE"
          echo "PROMOTE SAME DIGEST"
          echo "NO REBUILD"
          echo "GITHUB APP"
          echo "GITOPS"
          echo "ARGO CD"
          echo "VERIFIED"
          echo "=============================================="
