name: Deploy Selected Releases To Dev

on:
  workflow_dispatch:
    inputs:
      action:
        description: List available releases or deploy selected release runs
        required: true
        type: choice
        options:
          - list
          - deploy
      release_run_ids:
        description: Required for deploy; comma-separated Release run IDs from list mode
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

jobs:

  list-releases:

    name: List Successful Dev Releases
    if: inputs.action == 'list'
    runs-on: ubuntu-latest

    steps:

      - name: List release images and digests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_WORKFLOW_ID=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml" \
            --jq '.id')

          RUNS=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$RELEASE_WORKFLOW_ID/runs?branch=develop&status=completed&per_page=100")

          echo "## Successful releases from develop" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| # | Release run ID | Service | Version | Digest |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---:|---:|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          DOWNLOAD_ROOT=$(mktemp -d)
          trap 'rm -rf "$DOWNLOAD_ROOT"' EXIT

          INDEX=0
          while IFS= read -r RUN_ID; do
            [[ -n "$RUN_ID" ]] || continue

            ARTIFACTS=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("release-")) | .name]')

            while IFS= read -r ARTIFACT_NAME; do
              [[ -n "$ARTIFACT_NAME" ]] || continue

              DESTINATION="$DOWNLOAD_ROOT/$RUN_ID"
              mkdir -p "$DESTINATION"
              gh run download "$RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --name "$ARTIFACT_NAME" \
                --dir "$DESTINATION"

              RELEASE_FILE="$DESTINATION/release.json"
              if [[ ! -f "$RELEASE_FILE" ]]; then
                echo "ERROR: Release metadata missing from artifact $ARTIFACT_NAME (run $RUN_ID)."
                exit 1
              fi

              METADATA_RUN_ID=$(jq -r '.release_run_id // empty' "$RELEASE_FILE")
              SERVICE=$(jq -r '.service // empty' "$RELEASE_FILE")
              VERSION=$(jq -r '.version // empty' "$RELEASE_FILE")
              DIGEST=$(jq -r '.digest // empty' "$RELEASE_FILE")

              if [[ "$METADATA_RUN_ID" != "$RUN_ID" ||
                    -z "$SERVICE" || -z "$VERSION" || -z "$DIGEST" ]]; then
                echo "ERROR: Invalid release metadata in run $RUN_ID."
                exit 1
              fi

              INDEX=$((INDEX + 1))
              echo "| $INDEX | \`$RUN_ID\` | \`$SERVICE\` | \`$VERSION\` | \`$DIGEST\` |" \
                >> "$GITHUB_STEP_SUMMARY"
              echo "$INDEX. Run ID: $RUN_ID | $SERVICE $VERSION | $DIGEST"
            done < <(jq -r '.[]' <<< "$ARTIFACTS")
          done < <(jq -r '.workflow_runs[] | select(.conclusion == "success") | .id' <<< "$RUNS")

          if [[ "$INDEX" -eq 0 ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No successful, unexpired release artifacts were found for develop." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "No successful, unexpired release artifacts were found for develop."
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "To deploy one or more entries, select **deploy** and enter their run IDs, comma-separated." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  prepare:

    name: Validate Selected Releases
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest

    outputs:
      releases: ${{ steps.validate.outputs.releases }}

    steps:

      - name: Validate Release Run IDs
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_IDS: ${{ inputs.release_run_ids }}
        run: |
          set -euo pipefail

          RELEASE_WORKFLOW_ID=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml" \
            --jq '.id')

          IFS=',' read -r -a REQUESTED_RUN_IDS <<< "$RELEASE_RUN_IDS"
          if [[ ${#REQUESTED_RUN_IDS[@]} -eq 0 ]]; then
            echo "ERROR: Provide at least one Release workflow run ID."
            exit 1
          fi

          declare -A SEEN_RUN_IDS=()
          declare -A SEEN_SERVICES=()
          SELECTED_RELEASES=()
          DOWNLOAD_ROOT=$(mktemp -d)
          trap 'rm -rf "$DOWNLOAD_ROOT"' EXIT

          for RUN_ID in "${REQUESTED_RUN_IDS[@]}"; do
            RUN_ID="${RUN_ID//[[:space:]]/}"

            if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "ERROR: Invalid Release run ID: $RUN_ID"
              exit 1
            fi

            if [[ -n "${SEEN_RUN_IDS[$RUN_ID]:-}" ]]; then
              echo "ERROR: Duplicate Release run ID: $RUN_ID"
              exit 1
            fi
            SEEN_RUN_IDS[$RUN_ID]=1

            RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")

            if [[ "$(jq -r '.workflow_id' <<< "$RUN")" != "$RELEASE_WORKFLOW_ID" ]]; then
              echo "ERROR: Run $RUN_ID is not a run of release.yml."
              exit 1
            fi

            if [[ "$(jq -r '.status' <<< "$RUN")" != "completed" ||
                  "$(jq -r '.conclusion' <<< "$RUN")" != "success" ]]; then
              echo "ERROR: Release run $RUN_ID has not completed successfully."
              exit 1
            fi

            if [[ "$(jq -r '.head_branch' <<< "$RUN")" != "develop" ]]; then
              echo "ERROR: Release run $RUN_ID was not created from develop."
              exit 1
            fi

            ARTIFACTS=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("release-")) | .name]')

            if [[ "$(jq 'length' <<< "$ARTIFACTS")" != "1" ]]; then
              echo "ERROR: Expected exactly one available release artifact for run $RUN_ID."
              exit 1
            fi

            ARTIFACT_NAME=$(jq -r '.[0]' <<< "$ARTIFACTS")
            DESTINATION="$DOWNLOAD_ROOT/$RUN_ID"
            mkdir -p "$DESTINATION"
            gh run download "$RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$ARTIFACT_NAME" \
              --dir "$DESTINATION"

            RELEASE_FILE="$DESTINATION/release.json"
            if [[ ! -f "$RELEASE_FILE" ||
                  "$(jq -r '.release_run_id // empty' "$RELEASE_FILE")" != "$RUN_ID" ]]; then
              echo "ERROR: Release metadata is missing or does not match run $RUN_ID."
              exit 1
            fi

            SERVICE=$(jq -r '.service // empty' "$RELEASE_FILE")
            if [[ ! "$SERVICE" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              echo "ERROR: Release run $RUN_ID has an invalid service in its metadata."
              exit 1
            fi

            if [[ -n "${SEEN_SERVICES[$SERVICE]:-}" ]]; then
              echo "ERROR: Multiple selected releases target service $SERVICE."
              echo "Select only one release per service in a single deployment."
              exit 1
            fi
            SEEN_SERVICES[$SERVICE]=1

            SELECTED_RELEASES+=("$(jq -cn \
              --arg release_run_id "$RUN_ID" \
              --arg service "$SERVICE" \
              '{release_run_id: $release_run_id, service: $service}')")
          done

          echo "releases=$(printf '%s\n' "${SELECTED_RELEASES[@]}" | jq -sc '.')" \
            >> "$GITHUB_OUTPUT"

  deploy:

    name: Deploy ${{ matrix.release.service }} To Dev
    if: inputs.action == 'deploy'
    needs: prepare

    concurrency:
      group: dev-deployment-${{ matrix.release.service }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.prepare.outputs.releases) }}

    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:

      #################################################
      # Download Release Metadata
      #################################################

      - name: Download Release Metadata
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ matrix.release.release_run_id }}

      #################################################
      # Read Release Metadata
      #################################################

      - name: Read Release Metadata
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_FILE="release/release.json"

          if [[ ! -f "$RELEASE_FILE" ]]; then
            echo "ERROR: Release metadata not found:"
            echo "$RELEASE_FILE"
            exit 1
          fi

          SERVICE=$(jq -r '.service' "$RELEASE_FILE")
          VERSION=$(jq -r '.version' "$RELEASE_FILE")
          IMAGE_TAG=$(jq -r '.image_tag' "$RELEASE_FILE")
          DIGEST=$(jq -r '.digest' "$RELEASE_FILE")
          COMMIT=$(jq -r '.commit' "$RELEASE_FILE")
          RELEASE_ID=$(jq -r '.release_id' "$RELEASE_FILE")
          RELEASE_RUN_ID=$(jq -r '.release_run_id' "$RELEASE_FILE")
          SOURCE_BRANCH=$(jq -r '.source_branch' "$RELEASE_FILE")
          SOURCE_REPOSITORY=$(jq -r '.source_repository' "$RELEASE_FILE")

          if [[ -z "$SERVICE" || "$SERVICE" == "null" ]]; then
            echo "ERROR: Missing service."
            exit 1
          fi

          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "ERROR: Missing version."
            exit 1
          fi

          if [[ -z "$IMAGE_TAG" || "$IMAGE_TAG" == "null" ]]; then
            echo "ERROR: Missing image tag."
            exit 1
          fi

          if [[ -z "$DIGEST" || "$DIGEST" == "null" ]]; then
            echo "ERROR: Missing image digest."
            exit 1
          fi

          if [[ -z "$COMMIT" || "$COMMIT" == "null" ]]; then
            echo "ERROR: Missing source commit."
            exit 1
          fi

          if [[ -z "$RELEASE_ID" || "$RELEASE_ID" == "null" ]]; then
            echo "ERROR: Missing release ID."
            exit 1
          fi

          if [[ "$RELEASE_RUN_ID" != "${{ matrix.release.release_run_id }}" ]]; then
            echo "ERROR: Release metadata run ID does not match the selected run."
            echo "Metadata: $RELEASE_RUN_ID"
            echo "Selected: ${{ matrix.release.release_run_id }}"
            exit 1
          fi

          if [[ "$SOURCE_BRANCH" != "develop" ]]; then
            echo "ERROR: Release was not created from develop."
            echo "Branch: $SOURCE_BRANCH"
            exit 1
          fi

          if [[ "$SOURCE_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "ERROR: Release metadata belongs to a different repository."
            echo "Metadata: $SOURCE_REPOSITORY"
            echo "Current:  $GITHUB_REPOSITORY"
            exit 1
          fi

          echo "SERVICE=$SERVICE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "RELEASE_RUN_ID=$RELEASE_RUN_ID" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "Release Metadata"
          echo "=============================================="
          echo "Release ID     : $RELEASE_ID"
          echo "Release Run ID : $RELEASE_RUN_ID"
          echo "Service        : $SERVICE"
          echo "Version        : $VERSION"
          echo "Image Tag      : $IMAGE_TAG"
          echo "Commit         : $COMMIT"
          echo "Digest         : $DIGEST"
          echo "=============================================="

      #################################################
      # Validate Release Identity
      #################################################

      - name: Validate Release Identity
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid release version:"
            echo "$VERSION"
            exit 1
          fi

          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "ERROR: Invalid image digest:"
            echo "$DIGEST"
            exit 1
          fi

          if [[ ! "$COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "ERROR: Invalid source commit SHA:"
            echo "$COMMIT"
            exit 1
          fi

          echo "Release identity validated."

      #################################################
      # Validate Dev Environment Configuration
      #################################################

      - name: Validate Dev Environment Configuration
        shell: bash
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail

          if [[ -z "${EKS_CLUSTER_NAME:-}" ]]; then
            echo "::error::Set the EKS_CLUSTER_NAME variable in the dev GitHub Environment."
            exit 1
          fi

          if [[ -z "${AWS_ROLE_ARN:-}" ]]; then
            echo "::error::Set the AWS_ROLE_ARN secret in the dev GitHub Environment."
            exit 1
          fi

          if [[ ! "${AWS_ACCOUNT_ID:-}" =~ ^[0-9]{12}$ ]]; then
            echo "::error::Set AWS_ACCOUNT_ID to the 12-digit ECR account ID in the dev GitHub Environment."
            exit 1
          fi

          echo "Dev environment configuration is present."

      #################################################
      # Configure AWS Credentials
      #################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      #################################################
      # Verify EKS Cluster
      #################################################

      - name: Verify EKS Cluster
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER_STATUS=$(aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.status' \
            --output text)

          if [[ "$CLUSTER_STATUS" != "ACTIVE" ]]; then
            echo "::error::EKS cluster $EKS_CLUSTER_NAME is not ACTIVE (status: $CLUSTER_STATUS)."
            exit 1
          fi

          echo "EKS cluster is active in $AWS_REGION."

      #################################################
      # Verify ECR Repository
      #################################################

      - name: Verify ECR Repository
        shell: bash
        run: |
          set -euo pipefail

          aws ecr describe-repositories \
            --repository-names "$SERVICE" \
            --region "$AWS_REGION" \
            > /dev/null

          echo "ECR repository verified:"
          echo "$SERVICE"

      #################################################
      # Verify ECR Tag Immutability
      #################################################

      - name: Verify ECR Tag Immutability
        shell: bash
        run: |
          set -euo pipefail

          MUTABILITY=$(aws ecr describe-repositories \
            --repository-names "$SERVICE" \
            --region "$AWS_REGION" \
            --query 'repositories[0].imageTagMutability' \
            --output text)

          echo "ECR tag mutability: $MUTABILITY"

          if [[ "$MUTABILITY" != "IMMUTABLE" ]]; then
            echo "ERROR: ECR repository must use IMMUTABLE image tags."
            exit 1
          fi

      #################################################
      # Verify Exact ECR Digest
      #################################################

      - name: Verify ECR Digest
        shell: bash
        run: |
          set -euo pipefail

          VERIFIED_DIGEST=$(aws ecr describe-images \
            --repository-name "$SERVICE" \
            --image-ids imageDigest="$DIGEST" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [[ "$VERIFIED_DIGEST" != "$DIGEST" ]]; then
            echo "ERROR: ECR digest verification failed."
            echo "Expected: $DIGEST"
            echo "Actual  : $VERIFIED_DIGEST"
            exit 1
          fi

          echo "Approved digest verified:"
          echo "$SERVICE@$DIGEST"

      #################################################
      # Verify Build Tag
      #################################################

      - name: Verify Build Tag
        shell: bash
        run: |
          set -euo pipefail

          TAG_DIGEST=$(aws ecr describe-images \
            --repository-name "$SERVICE" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [[ "$TAG_DIGEST" != "$DIGEST" ]]; then
            echo "ERROR: Build tag does not point to approved digest."
            echo "Tag digest     : $TAG_DIGEST"
            echo "Approved digest: $DIGEST"
            exit 1
          fi

          echo "Build tag verified:"
          echo "$SERVICE:$IMAGE_TAG"
          echo "$SERVICE@$DIGEST"

      #################################################
      # Configure EKS
      #################################################

      - name: Configure EKS
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

          kubectl cluster-info

      #################################################
      # Verify Dev Deployment Exists
      #################################################

      - name: Verify Dev Deployment
        shell: bash
        run: |
          set -euo pipefail

          kubectl get deployment "$SERVICE" \
            --namespace dev

          echo "Dev deployment verified:"
          echo "$SERVICE"

      #################################################
      # Deploy Exact Immutable Digest
      #################################################

      - name: Deploy Exact Digest
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${SERVICE}@${DIGEST}"

          echo "Deploying:"
          echo "$IMAGE"

          kubectl -n dev set image \
            deployment/"$SERVICE" \
            "$SERVICE=$IMAGE"

      #################################################
      # Wait For Deployment Rollout
      #################################################

      - name: Wait For Rollout
        shell: bash
        run: |
          set -euo pipefail

          kubectl rollout status \
            deployment/"$SERVICE" \
            --namespace dev \
            --timeout=5m

      #################################################
      # Verify Deployed Image
      #################################################

      - name: Verify Deployed Digest
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${SERVICE}@${DIGEST}"

          ACTUAL=$(kubectl get deployment "$SERVICE" \
            --namespace dev \
            -o jsonpath='{.spec.template.spec.containers[0].image}')

          echo "Expected:"
          echo "$EXPECTED"

          echo "Actual:"
          echo "$ACTUAL"

          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "ERROR: Dev deployment does not reference approved digest."
            exit 1
          fi

          echo "Deployment image verified."

      #################################################
      # Verify Running Pods
      #################################################

      - name: Verify Running Pods
        shell: bash
        run: |
          set -euo pipefail

          READY_REPLICAS=$(kubectl get deployment "$SERVICE" \
            --namespace dev \
            -o jsonpath='{.status.readyReplicas}')

          DESIRED_REPLICAS=$(kubectl get deployment "$SERVICE" \
            --namespace dev \
            -o jsonpath='{.spec.replicas}')

          echo "Desired replicas: ${DESIRED_REPLICAS:-0}"
          echo "Ready replicas  : ${READY_REPLICAS:-0}"

          if [[ "${READY_REPLICAS:-0}" != "${DESIRED_REPLICAS:-0}" ]]; then
            echo "ERROR: Not all Dev replicas are ready."
            exit 1
          fi

          echo "All Dev replicas are ready."

      #################################################
      # Dev Deployment Summary
      #################################################

      - name: Dev Deployment Summary
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "DEV DEPLOYMENT SUCCESSFUL"
          echo "=============================================="
          echo ""
          echo "Release ID:"
          echo "$RELEASE_ID"
          echo ""
          echo "Release Run ID:"
          echo "$RELEASE_RUN_ID"
          echo ""
          echo "Service:"
          echo "$SERVICE"
          echo ""
          echo "Version:"
          echo "$VERSION"
          echo ""
          echo "Build Tag:"
          echo "$IMAGE_TAG"
          echo ""
          echo "Source Commit:"
          echo "$COMMIT"
          echo ""
          echo "Immutable Digest:"
          echo "$DIGEST"
          echo ""
          echo "Environment:"
          echo "dev"
          echo ""
          echo "Deployment Method:"
          echo "Direct kubectl → EKS"
          echo ""
          echo "=============================================="
          echo "BUILD ONCE"
          echo "DEPLOY SAME DIGEST"
          echo "NO REBUILD"
          echo "DEV VERIFIED"
          echo "=============================================="

      - name: Preserve Deployed Release Metadata
        uses: actions/upload-artifact@v4
        with:
          name: deployed-release-${{ matrix.release.release_run_id }}
          path: release/
          retention-days: 90
