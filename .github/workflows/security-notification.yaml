name: Security - Notification

on:
  workflow_run:
    workflows: ["Security - Scheduled"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare normalized findings
        run: |
          mkdir -p normalized
          : > normalized/all.jsonl
          : > normalized/deduplicated.jsonl
          : > normalized/keys.txt

      - name: Combine and deduplicate findings
        run: |
          cat reports/*/*.jsonl 2>/dev/null > normalized/all.jsonl || true
          while IFS= read -r FINDING; do
            [ -z "$FINDING" ] && continue
            KEY=$(echo "$FINDING" | jq -r '.vulnerability_id + "|" + .package + "|" + .target')
            if ! grep -qF "$KEY" normalized/keys.txt 2>/dev/null; then
              echo "$KEY" >> normalized/keys.txt
              echo "$FINDING" >> normalized/deduplicated.jsonl
            fi
          done < normalized/all.jsonl || true

      - name: Create or update security issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS= read -r FINDING; do
            SCANNER=$(echo "$FINDING" | jq -r '.scanner')
            VULN=$(echo "$FINDING" | jq -r '.vulnerability_id')
            PACKAGE=$(echo "$FINDING" | jq -r '.package')
            SEVERITY=$(echo "$FINDING" | jq -r '.severity')
            TARGET=$(echo "$FINDING" | jq -r '.target')

            ENGINEERING_TEAM="@Coreinfra-Labs/platform"
            case "$TARGET" in
              services/api-gateway/*|services/payment-service/*|services/user-service/*)
                ENGINEERING_TEAM="@Coreinfra-Labs/backend" ;;
              services/web/*|services/web-e2e/*)
                ENGINEERING_TEAM="@Coreinfra-Labs/frontend" ;;
              libs/*)
                ENGINEERING_TEAM="@Coreinfra-Labs/backend" ;;
              .github/workflows/security/*)
                ENGINEERING_TEAM="@Coreinfra-Labs/devsecops" ;;
              .github/dependabot.yml)
                ENGINEERING_TEAM="@Coreinfra-Labs/security" ;;
            esac

            case "$(echo "$SEVERITY" | tr '[:upper:]' '[:lower:]')" in
              critical) SEVERITY_LABEL="severity:critical" ;;
              high) SEVERITY_LABEL="severity:high" ;;
              medium) SEVERITY_LABEL="severity:medium" ;;
              low) SEVERITY_LABEL="severity:low" ;;
              *) SEVERITY_LABEL="severity:medium" ;;
            esac

            gh issue create \
              --repo "${{ github.repository }}" \
              --title "[Security][$SEVERITY] $VULN - $PACKAGE" \
              --body "Detected by $SCANNER in $TARGET. Assigned to $ENGINEERING_TEAM." \
              --label "security:automated" \
              --label "$SEVERITY_LABEL" \
              --label "scanner:$SCANNER" \
              --label "status:triage" || true
          done < normalized/deduplicated.jsonl

      - name: Send Severity-based Slack Alerts
        if: always()
        env:
          SLACK_CRITICAL: ${{ secrets.SLACK_CRITICAL_WEBHOOK }}
          SLACK_HIGH: ${{ secrets.SLACK_HIGH_WEBHOOK }}
          SLACK_MEDIUM: ${{ secrets.SLACK_MEDIUM_WEBHOOK }}
          SLACK_LOW: ${{ secrets.SLACK_LOW_WEBHOOK }}
        run: |
          while IFS= read -r FINDING; do
            SEVERITY=$(echo "$FINDING" | jq -r '.severity' | tr '[:upper:]' '[:lower:]')
            case "$SEVERITY" in
              critical) HOOK="$SLACK_CRITICAL" ;;
              high) HOOK="$SLACK_HIGH" ;;
              medium) HOOK="$SLACK_MEDIUM" ;;
              low) HOOK="$SLACK_LOW" ;;
              *) HOOK="$SLACK_MEDIUM" ;;
            esac
            curl -s -X POST -H "Content-Type: application/json" \
              --data "{\"text\":\"🚨 [$SEVERITY] Security finding in ${{ github.repository }}\"}" "$HOOK" || true
          done < normalized/deduplicated.jsonl

      - name: Security notification summary
        if: always()
        run: |
          echo "## 🔐 Security Notification" >> "$GITHUB_STEP_SUMMARY"
          echo "**Repository:** ${{ github.repository }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Security findings processed, issues created, and Slack alerts sent." >> "$GITHUB_STEP_SUMMARY"
