name: ESLint Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  eslint-diagnostics:
    name: Diagnose ESLint and Nx
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.8.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Show runtime versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check root ESLint version
        run: pnpm exec eslint --version

      - name: Check web project ESLint version
        run: pnpm --dir services/web exec eslint --version

      - name: Run web lint
        run: pnpm nx lint web --skip-nx-cache
```
