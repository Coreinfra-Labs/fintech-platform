version: 2

updates:



  # ============================================================
  # NORMAL NPM / PNPM DEPENDENCY UPDATES
  #
  # Dependabot → develop → CI → Security → Review → Merge
  # ============================================================

  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Africa/Lagos"

    open-pull-requests-limit: 3

    cooldown:
      default-days: 7

    labels:
      - "security:automated"
      - "scanner:sca"
      - "type:dependency"

    commit-message:
      prefix: "deps"

    groups:

      nx:
        patterns:
          - "nx"
          - "@nx/*"
        update-types:
          - "minor"
          - "patch"

      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-*"
          - "@types/react*"
        update-types:
          - "minor"
          - "patch"

      angular:
        patterns:
          - "@angular/*"
        update-types:
          - "minor"
          - "patch"

      typescript:
        patterns:
          - "typescript"
          - "@types/node"
        update-types:
          - "minor"
          - "patch"

      testing:
        patterns:
          - "jest"
          - "@jest/*"
          - "vitest"
          - "@vitest/*"
          - "playwright"
          - "@playwright/*"
        update-types:
          - "minor"
          - "patch"

      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
        update-types:
          - "minor"
          - "patch"


  # ============================================================
  # GITHUB ACTIONS
  #
  # Normal updates → develop
  # Security updates → main automatically
  # ============================================================

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:30"
      timezone: "Africa/Lagos"

    open-pull-requests-limit: 2

    cooldown:
      default-days: 7

    labels:
      - "security:automated"
      - "scanner:sca"
      - "type:dependency"

    commit-message:
      prefix: "ci"

    groups:

      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"